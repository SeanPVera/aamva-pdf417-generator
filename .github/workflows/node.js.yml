name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      run: pnpm run lint

    - name: Format check
      run: pnpm run format:check

    - name: Typecheck
      run: pnpm run typecheck

    - name: Build
      run: pnpm run build --if-present

    - name: Test
      run: pnpm run test:run

    - name: Coverage (with thresholds)
      if: matrix.node-version == '22.x'
      run: pnpm run test:coverage

    - name: Bundle size budget
      if: matrix.node-version == '22.x'
      run: pnpm run size

    - name: Upload coverage report
      if: matrix.node-version == '22.x'
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage/
        retention-days: 14

    - name: Audit dependencies
      # Use --audit-level=high so moderate/info advisories don't block CI,
      # but high-severity vulnerabilities are always a release blocker.
      # Omit dev dependencies as these often contain unavoidable vulnerabilities
      # that shouldn't block local development PRs.
      run: pnpm audit --prod --audit-level=high
