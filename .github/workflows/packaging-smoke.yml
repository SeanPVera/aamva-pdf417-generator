name: Desktop packaging smoke

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - scripts/apply-dependency-compat.mjs
      - scripts/dependency-contracts.mjs
      - scripts/dependency-fixtures.mjs
      - .github/workflows/packaging-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arguments: --linux --dir
          - os: windows-latest
            platform: windows
            arguments: --win nsis
          - os: macos-latest
            platform: macos-universal
            arguments: --mac --universal --dir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency compatibility and advisory regressions
        run: npm run test:dependencies
      - name: Build web assets
        run: npm run build
      - name: Package without publishing
        run: npx electron-builder ${{ matrix.arguments }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
